name: flow-pipeline-syntax-check
on:
  push:
    branches:
      - chatgpt/semantic-montage-stage2-2026-11-27
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile flow_pipeline.py
      - name: AST parse
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('flow_pipeline.py').read_text(encoding='utf-8')); print('AST OK')"
